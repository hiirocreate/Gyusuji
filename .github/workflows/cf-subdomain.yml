name: cf-subdomain
# Cloudflare の workers.dev サブドメイン（<Worker名>.<ここ>.workers.dev の「ここ」）を変更する
# GitHub → Actions → cf-subdomain → Run workflow で新しい名前を入力して実行
on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: '新しいサブドメイン（英数字とハイフン。例 beefhunter）'
        required: true
jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - name: 入力チェック
        env: { SUB: "${{ inputs.subdomain }}" }
        run: |
          if ! echo "$SUB" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
            echo "::error::使えない名前です（小文字英数字とハイフン、先頭末尾のハイフン不可）"; exit 1
          fi
      - name: サブドメインを付け替え（失敗時は元に戻す）
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB: ${{ inputs.subdomain }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/subdomain"
          AUTH="Authorization: Bearer $TOKEN"
          put() { curl -sS -X PUT "$API" -H "$AUTH" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$1\"}"; }
          cur=$(curl -sS "$API" -H "$AUTH")
          echo "現在: $cur"
          OLD=$(echo "$cur" | sed -n 's/.*"subdomain": *"\([^"]*\)".*/\1/p')
          if [ "$OLD" = "$SUB" ]; then echo "::notice::すでに $SUB です"; exit 0; fi
          # 既存のサブドメインがあると上書きできないため、一度削除してから付け直す
          if [ -n "$OLD" ]; then
            del=$(curl -sS -X DELETE "$API" -H "$AUTH"); echo "削除: $del"
            echo "$del" | grep -Eq '"success": *true' || { echo "::error::旧サブドメインを削除できませんでした"; exit 1; }
          fi
          res=$(put "$SUB"); echo "設定: $res"
          if echo "$res" | grep -Eq '"success": *true'; then
            echo "::notice::新しいURL: https://gyusuji.$SUB.workers.dev（反映まで数分かかることがあります）"
            exit 0
          fi
          echo "::error::$SUB は使えませんでした（使用中の可能性）。元の $OLD に戻します"
          [ -n "$OLD" ] && echo "戻す: $(put "$OLD")"
          exit 1
