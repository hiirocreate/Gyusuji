name: web
# ダッシュボードの Git 連携（Workers Builds）を使う場合、このワークフローは Secrets 未設定のため自動でスキップされる
# 自動公開は Cloudflare 側の Git 連携（Workers Builds）が行うため、ここは手動実行のみ
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build -w packages/client
        env: { VITE_SERVER_URL: "${{ secrets.SERVER_URL }}" }
      - name: Check secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cloudflare/wrangler-action@v4
        if: steps.cf.outputs.ok == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # main は本番、その他のブランチはプレビュー版として上げる
          command: ${{ github.ref_name == 'main' && 'deploy' || 'versions upload' }}
